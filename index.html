<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khac Vy · terminal</title>
    <meta
      name="description"
      content="Khac Vy's portfolio as a terminal. Software engineer, builds on Solana, lately building tools around coding agents."
    />
    <meta name="theme-color" content="#141413" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='26' font-size='28' text-anchor='middle' fill='%23d97757'%3E%E2%9C%BB%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint to avoid a theme flash. Key matches THEME_KEY in src/main.ts.
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main id="app">
      <div id="transcript" role="log" aria-live="polite" aria-label="Terminal output"></div>

      <div id="prompt-area">
        <div class="prompt-box">
          <span class="prompt-glyph" aria-hidden="true">&gt;</span>
          <input
            id="cmd"
            type="text"
            role="combobox"
            aria-label="Command"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="menu"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            autofocus
          />
        </div>
        <div id="menu" class="menu" role="listbox" aria-label="Commands" hidden></div>
        <div class="hints">
          <span>? for shortcuts</span>
          <span id="hint-menu" class="hint-menu" hidden>↑↓ navigate · Tab complete · Esc to close</span>
        </div>
        <nav class="chips" aria-label="Quick commands">
          <button type="button" data-run="about">/about</button>
          <button type="button" data-run="work">/work</button>
          <button type="button" data-run="blog">/blog</button>
          <button type="button" data-run="contact">/contact</button>
          <button type="button" data-run="help">/help</button>
        </nav>
      </div>
    </main>

    <noscript>
      <div class="noscript">
        <p>Khac Vy (trankhacvy). Software engineer at Dwarves Foundation. Vietnam.</p>
        <p>
          This site is a terminal and needs JavaScript. Elsewhere:
          <a href="https://github.com/trankhacvy">GitHub</a>,
          <a href="https://x.com/trankhac_vy">X</a>,
          <a href="https://khacvy.substack.com">Substack</a>,
          <a href="mailto:khacvy93@gmail.com">Email</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
